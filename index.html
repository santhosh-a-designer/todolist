<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todoist - Multi-List & Student Fee Tracker</title>

</head>
<body>
  <div class="app-container">
    <!-- Left Sidebar (Todoist Replica) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-profile">
          <div class="avatar" id="userAvatar">SA</div>
          <span class="user-name">Santhosh</span>
          <svg class="chevron-down-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        <button class="icon-btn sidebar-toggle-btn" id="sidebarCloseBtn" title="Close sidebar" aria-label="Close sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
      </div>

      <!-- Add Task Quick Action Button -->
      <div class="sidebar-add-btn-wrapper">
        <button class="add-task-btn" id="sidebarQuickAddBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          <span id="sidebarQuickAddLabel">Add item</span>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="sidebar-nav">
        <!-- Search -->
        <div class="nav-item search-item">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="sidebarSearchInput" placeholder="Search tasks, students, slots..." class="nav-search-input">
        </div>

        <!-- Dashboard / Overview -->
        <a href="#dashboard" class="nav-item" id="navDashboard">
          <svg class="nav-icon blue-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span class="nav-label">All Projects Dashboard</span>
          <span class="nav-count" id="totalProjectsCount">2</span>
        </a>

        <!-- My Projects Section -->
        <div class="sidebar-section-header">
          <span class="section-title">My Projects</span>
          <button class="icon-btn" id="openAddProjectFormBtn" title="Add new project" aria-label="Add project">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <!-- Inline Add Project Form -->
        <form class="inline-add-project-form hidden" id="inlineAddProjectForm">
          <input type="text" id="newProjectNameInput" placeholder="Project name (e.g. Quick Tasks)" class="todoist-input" required autocomplete="off">
          <div class="project-form-row">
            <select id="newProjectTypeSelect" class="todoist-select">
              <option value="tasks">Quick Tasks Todo</option>
              <option value="fees">Student Fee Tracker</option>
            </select>
            <div class="color-picker-wrapper">
              <input type="color" id="newProjectColorInput" value="#db4c3f" title="Choose color">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="todoist-btn primary-btn">Add Project</button>
            <button type="button" class="todoist-btn cancel-btn" id="cancelAddProjectBtn">Cancel</button>
          </div>
        </form>

        <!-- Dynamic List of Projects in Sidebar -->
        <div class="sidebar-projects-list" id="sidebarProjectsList">
          <!-- Rendered dynamically -->
        </div>
      </nav>

      <!-- Sidebar Earnings Dashboard Card (Active for fee projects) -->
      <div class="sidebar-earnings-card" id="sidebarEarningsCard">
        <div class="earnings-card-header">
          <div class="earnings-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            <span id="sidebarCardTitle">Fee Collection</span>
          </div>
          <span class="earnings-percent-badge" id="earningsPercentage">0%</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="sidebarProgressFill" style="width: 0%;"></div>
        </div>

        <div class="earnings-stat-row">
          <div class="stat-col">
            <span class="stat-label" id="sidebarStat1Label">Total Earned</span>
            <span class="stat-value earned" id="sidebarTotalEarned">₹0</span>
          </div>
          <div class="stat-col">
            <span class="stat-label" id="sidebarStat2Label">Potential</span>
            <span class="stat-value" id="sidebarTotalPotential">₹0</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar Header -->
      <header class="top-header">
        <div class="top-header-left">
          <button class="icon-btn mobile-sidebar-open" id="sidebarOpenBtn" title="Open sidebar" aria-label="Open sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="view-title-container">
            <h1 class="view-title" id="mainViewTitle">Inbox</h1>
            <span class="active-date-badge" id="currentDateBadge">Today</span>
          </div>
        </div>

        <div class="top-header-right" id="topHeaderRightActions">
          <!-- Live Header Stat Chips -->
          <div class="header-stat-chip potential-chip" id="headerPotentialChip" title="Remaining uncollected fees / pending tasks">
            <span class="chip-label" id="headerChip1Label">Potential:</span>
            <strong class="chip-val" id="headerTotalPotential">₹0</strong>
          </div>
          <div class="header-stat-chip earned-chip" id="headerEarnedChip" title="Total Collected Fees / completed tasks">
            <span class="chip-label" id="headerChip2Label">Earned:</span>
            <strong class="chip-val text-success" id="headerTotalEarned">₹0</strong>
          </div>

          <!-- Action buttons for slots -->
          <button class="action-pill-btn" id="toggleAllSlotsBtn" title="Collapse / Expand All Slots">
            <svg class="toggle-slots-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="7 13 12 18 17 13"></polyline>
              <polyline points="7 6 12 11 17 6"></polyline>
            </svg>
            <span id="toggleAllSlotsText">Collapse all</span>
          </button>
        </div>
      </header>

      <!-- View 1: Projects Overview Dashboard -->
      <section class="dashboard-view hidden" id="dashboardView">
        <div class="dashboard-welcome">
          <h2>Manage Your Todo Lists & Projects</h2>
          <p>Quickly switch to any list or create new project trackers.</p>
        </div>
        <div class="dashboard-grid" id="dashboardGrid">
          <!-- Rendered dynamically -->
        </div>
      </section>

      <!-- View 2: Fee Tracker Slots Container (for fee projects) -->
      <section class="slots-container" id="slotsContainer">
        <!-- Rendered dynamically via app.js -->
      </section>

      <!-- View 3: Quick Tasks Container (for standard task projects) -->
      <section class="quick-tasks-container hidden" id="quickTasksContainer">
        <div class="quick-tasks-list" id="quickTasksList">
          <!-- Rendered dynamically -->
        </div>
        <div class="add-quick-task-section">
          <button class="add-student-trigger-btn" id="showQuickTaskFormBtn">
            <span class="add-plus-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </span>
            <span>Add task</span>
          </button>
          <form class="inline-form hidden" id="inlineQuickTaskForm">
            <input type="text" id="quickTaskTextInput" placeholder="Task name (e.g. Call student parent, Update schedule)" class="todoist-input" required autocomplete="off">
            <div class="form-actions" style="margin-top: 10px;">
              <button type="submit" class="todoist-btn primary-btn">Add task</button>
              <button type="button" class="todoist-btn cancel-btn" id="cancelQuickTaskBtn">Cancel</button>
            </div>
          </form>
        </div>
      </section>

      <!-- Add New Time Slot Inline Section at bottom (for fee projects) -->
      <div class="add-slot-section" id="addSlotSection">
        <button class="add-slot-trigger-btn" id="showAddSlotFormBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add time slot</span>
        </button>

        <form class="inline-add-slot-form hidden" id="inlineAddSlotForm">
          <div class="slot-input-row">
            <input type="text" id="newSlotNameInput" placeholder="Time slot (e.g. 11AM-12PM or 4-5PM)" class="todoist-input" required autocomplete="off">
            <input type="text" id="newSlotDateInput" placeholder="Date tag (e.g. 11 Aug)" class="todoist-input-sm" value="11 Aug">
          </div>
          <div class="form-actions">
            <button type="submit" class="todoist-btn primary-btn">Add Slot</button>
            <button type="button" class="todoist-btn cancel-btn" id="cancelAddSlotBtn">Cancel</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
