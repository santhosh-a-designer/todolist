<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todoist - Time Slots & Student Fee Tracker</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Left Sidebar (Todoist Replica) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-profile">
          <div class="avatar" id="userAvatar">SA</div>
          <span class="user-name">Santhosh</span>
          <svg class="chevron-down-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        <div class="sidebar-header-actions">
          <button class="icon-btn" title="Notifications" aria-label="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge"></span>
          </button>
          <button class="icon-btn sidebar-toggle-btn" id="sidebarCloseBtn" title="Close sidebar" aria-label="Close sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Add Task Quick Action Button -->
      <div class="sidebar-add-btn-wrapper">
        <button class="add-task-btn" id="quickAddSlotBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          <span>Add time slot</span>
        </button>
      </div>

      <!-- Navigation Links -->
      <nav class="sidebar-nav">
        <!-- Search -->
        <div class="nav-item search-item">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="sidebarSearchInput" placeholder="Search students or slots..." class="nav-search-input">
        </div>

        <a href="#inbox" class="nav-item active" id="navInbox">
          <svg class="nav-icon red-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
            <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
          </svg>
          <span class="nav-label">Inbox</span>
          <span class="nav-count" id="inboxCount">0</span>
        </a>

        <a href="#today" class="nav-item" id="navToday">
          <svg class="nav-icon green-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span class="nav-label">Today</span>
          <span class="nav-count orange-count" id="todayPendingCount">0</span>
        </a>

        <a href="#upcoming" class="nav-item" id="navUpcoming">
          <svg class="nav-icon purple-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <line x1="8" y1="14" x2="8" y2="14"></line>
            <line x1="12" y1="14" x2="12" y2="14"></line>
            <line x1="16" y1="14" x2="16" y2="14"></line>
          </svg>
          <span class="nav-label">Upcoming</span>
        </a>

        <a href="#reporting" class="nav-item" id="navReporting">
          <svg class="nav-icon blue-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span class="nav-label">Reporting</span>
        </a>
      </nav>

      <!-- Sidebar Earnings Dashboard Card -->
      <div class="sidebar-earnings-card">
        <div class="earnings-card-header">
          <div class="earnings-title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            <span>Fee Collection</span>
          </div>
          <span class="earnings-percent-badge" id="earningsPercentage">0%</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="sidebarProgressFill" style="width: 0%;"></div>
        </div>

        <div class="earnings-stat-row">
          <div class="stat-col">
            <span class="stat-label">Total Earned</span>
            <span class="stat-value earned" id="sidebarTotalEarned">₹0</span>
          </div>
          <div class="stat-col">
            <span class="stat-label">Potential</span>
            <span class="stat-value" id="sidebarTotalPotential">₹0</span>
          </div>
        </div>

        <div class="earnings-pending-row">
          <span class="pending-label">Pending:</span>
          <span class="pending-value" id="sidebarPendingAmount">₹0</span>
        </div>
      </div>

      <!-- Sidebar Bottom Actions -->
      <div class="sidebar-footer">
        <button class="footer-btn" id="currencyToggleBtn" title="Switch Currency Format">
          <span class="currency-symbol" id="currentCurrencySymbol">₹</span>
          <span id="currencyBtnText">Currency: INR (₹)</span>
        </button>
        <button class="footer-btn" id="exportDataBtn" title="Export Backup JSON">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Export JSON</span>
        </button>
        <button class="footer-btn" id="importDataBtn" title="Import Data from JSON">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Import JSON</span>
        </button>
        <button class="footer-btn text-muted" id="resetDataBtn" title="Reset to default sample data">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span>Reset Sample</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar Header -->
      <header class="top-header">
        <div class="top-header-left">
          <button class="icon-btn mobile-sidebar-open" id="sidebarOpenBtn" title="Open sidebar" aria-label="Open sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="view-title-container">
            <h1 class="view-title">Inbox</h1>
            <span class="active-date-badge" id="currentDateBadge">Today</span>
          </div>
        </div>

        <div class="top-header-right">
          <!-- Live Header Stat Chips -->
          <div class="header-stat-chip potential-chip" title="Total Potential Fees">
            <span class="chip-label">Potential:</span>
            <strong class="chip-val" id="headerTotalPotential">₹0</strong>
          </div>
          <div class="header-stat-chip earned-chip" title="Total Collected Fees">
            <span class="chip-label">Earned:</span>
            <strong class="chip-val text-success" id="headerTotalEarned">₹0</strong>
          </div>

          <!-- Action buttons -->
          <button class="action-pill-btn" id="toggleAllSlotsBtn" title="Collapse / Expand All Slots">
            <svg class="toggle-slots-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="7 13 12 18 17 13"></polyline>
              <polyline points="7 6 12 11 17 6"></polyline>
            </svg>
            <span id="toggleAllSlotsText">Collapse all</span>
          </button>
        </div>
      </header>

      <!-- Main Slot List Container -->
      <section class="slots-container" id="slotsContainer">
        <!-- Rendered dynamically via app.js -->
      </section>

      <!-- Add New Time Slot Inline Section at bottom -->
      <div class="add-slot-section" id="addSlotSection">
        <button class="add-slot-trigger-btn" id="showAddSlotFormBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add time slot</span>
        </button>

        <form class="inline-add-slot-form hidden" id="inlineAddSlotForm">
          <div class="slot-input-row">
            <input type="text" id="newSlotNameInput" placeholder="Time slot (e.g. 11AM-12PM or 4-5PM)" class="todoist-input" required autocomplete="off">
            <input type="text" id="newSlotDateInput" placeholder="Date tag (e.g. 11 Aug)" class="todoist-input-sm" value="11 Aug">
          </div>
          <div class="form-actions">
            <button type="submit" class="todoist-btn primary-btn">Add Slot</button>
            <button type="button" class="todoist-btn cancel-btn" id="cancelAddSlotBtn">Cancel</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Hidden File Input for Data Import -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;">

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
